<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="dots-sewer" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#f4f3ea" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#1a1a17"/>
  <rect width="1200" height="900" fill="url(#dots-sewer)"/>

  <!-- Pipe cross-section, running horizontally through the middle -->
  <g>
    <rect x="0" y="380" width="1200" height="180" fill="#232320"/>
    <line x1="0" y1="380" x2="1200" y2="380" stroke="#f4f3ea" strokeOpacity="0.3" strokeWidth="4"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#f4f3ea" strokeOpacity="0.3" strokeWidth="4"/>
  </g>

  <!-- Blockage being cleared (debris blob pushed right) -->
  <g opacity="0.85">
    <ellipse cx="860" cy="470" rx="70" ry="46" fill="#3a2f22" stroke="#5a4a35" strokeWidth="3"/>
    <ellipse cx="900" cy="450" rx="30" ry="20" fill="#3a2f22" stroke="#5a4a35" strokeWidth="3"/>
  </g>

  <!-- Water jet nozzle head + spray, entering from left -->
  <g>
    <rect x="60" y="452" width="180" height="36" rx="18" fill="#1a1a17" stroke="#b6e400" strokeWidth="5"/>
    <circle cx="250" cy="470" r="26" fill="#1a1a17" stroke="#b6e400" strokeWidth="5"/>
    <!-- jet spray lines -->
    <path d="M 276 470 L 520 470" stroke="#b6e400" strokeWidth="6" strokeLinecap="round"/>
    <path d="M 276 458 L 480 430" stroke="#b6e400" strokeWidth="4" strokeLinecap="round" opacity="0.7"/>
    <path d="M 276 482 L 480 510" stroke="#b6e400" strokeWidth="4" strokeLinecap="round" opacity="0.7"/>
    <path d="M 276 448 L 440 405" stroke="#b6e400" strokeWidth="3" strokeLinecap="round" opacity="0.45"/>
    <path d="M 276 492 L 440 535" stroke="#b6e400" strokeWidth="3" strokeLinecap="round" opacity="0.45"/>
  </g>

  <!-- Hose leading off-screen to a service van, upper left -->
  <path d="M 150 452 C 150 380, 120 340, 120 280" fill="none" stroke="#b6e400" strokeWidth="10" strokeLinecap="round"/>

  <!-- CCTV inspection camera unit trailing on the right, on a cable -->
  <g>
    <path d="M 1000 470 C 1060 470, 1080 430, 1080 380 C 1080 330, 1080 300, 1080 260"
          fill="none" stroke="#f4f3ea" strokeOpacity="0.5" strokeWidth="4" strokeDasharray="2 10" strokeLinecap="round"/>
    <circle cx="980" cy="470" r="24" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="5"/>
    <circle cx="988" cy="470" r="8" fill="#b6e400"/>
  </g>

  <!-- Simple van above ground, upper left -->
  <g>
    <rect x="40" y="150" width="220" height="110" rx="14" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="4"/>
    <rect x="60" y="170" width="70" height="50" rx="6" fill="none" stroke="#f4f3ea" strokeWidth="3" opacity="0.7"/>
    <circle cx="90" cy="270" r="26" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="5"/>
    <circle cx="90" cy="270" r="8" fill="#f4f3ea" opacity="0.5"/>
    <circle cx="210" cy="270" r="26" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="5"/>
    <circle cx="210" cy="270" r="8" fill="#f4f3ea" opacity="0.5"/>
  </g>

  <g opacity="0.55">
    <circle cx="60" cy="700" r="4" fill="#b6e400"/>
    <text x="78" y="706" fontFamily="Helvetica, Arial, sans-serif" fontSize="20" letterSpacing="3" fill="#f4f3ea">SEWER &amp; DRAIN LINE SERVICE</text>
  </g>
</svg>
