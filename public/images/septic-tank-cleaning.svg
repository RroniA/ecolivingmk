<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="dots-septic" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#f4f3ea" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Sky / background -->
  <rect width="1200" height="900" fill="#1a1a17"/>
  <rect width="1200" height="900" fill="url(#dots-septic)"/>

  <!-- Ground -->
  <rect x="0" y="520" width="1200" height="380" fill="#232320"/>
  <rect x="0" y="512" width="1200" height="8" fill="#2a2a25"/>

  <!-- Underground tank cross-section -->
  <g>
    <rect x="430" y="640" width="340" height="180" rx="10" fill="none" stroke="#f4f3ea" strokeOpacity="0.35" strokeWidth="4" strokeDasharray="10 8"/>
    <!-- waste level -->
    <rect x="446" y="700" width="308" height="104" rx="4" fill="#b6e400" opacity="0.16"/>
    <line x1="446" y1="700" x2="754" y2="700" stroke="#b6e400" strokeWidth="3" opacity="0.6"/>
    <!-- divider wall inside tank -->
    <line x1="600" y1="656" x2="600" y2="814" stroke="#f4f3ea" strokeOpacity="0.25" strokeWidth="3"/>
  </g>

  <!-- Inlet pipe from a house (off-screen left) -->
  <rect x="250" y="600" width="190" height="26" fill="none" stroke="#f4f3ea" strokeOpacity="0.3" strokeWidth="4"/>

  <!-- Vacuum hose from truck down into tank -->
  <path d="M 760 430 C 760 500, 700 520, 700 590 C 700 630, 700 640, 700 656"
        fill="none" stroke="#b6e400" strokeWidth="10" strokeLinecap="round"/>

  <!-- Vacuum truck body -->
  <g>
    <rect x="740" y="330" width="300" height="130" rx="10" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="4"/>
    <!-- tank drum -->
    <rect x="760" y="300" width="220" height="80" rx="38" fill="none" stroke="#b6e400" strokeWidth="6"/>
    <!-- cab -->
    <path d="M 1040 460 L 1040 380 L 1100 380 L 1140 430 L 1140 460 Z" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="4" strokeLinejoin="round"/>
    <rect x="1055" y="392" width="45" height="30" rx="4" fill="none" stroke="#f4f3ea" strokeWidth="3" opacity="0.7"/>
    <!-- wheels -->
    <circle cx="820" cy="470" r="34" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="5"/>
    <circle cx="820" cy="470" r="10" fill="#f4f3ea" opacity="0.5"/>
    <circle cx="1080" cy="470" r="34" fill="#1a1a17" stroke="#f4f3ea" strokeWidth="5"/>
    <circle cx="1080" cy="470" r="10" fill="#f4f3ea" opacity="0.5"/>
  </g>

  <!-- Small warning / service marker flag near tank -->
  <g>
    <line x1="500" y1="580" x2="500" y2="512" stroke="#b6e400" strokeWidth="4"/>
    <path d="M 500 512 L 548 528 L 500 544 Z" fill="#b6e400"/>
  </g>

  <!-- Bottom label strip -->
  <g opacity="0.55">
    <circle cx="60" cy="60" r="4" fill="#b6e400"/>
    <text x="78" y="66" fontFamily="Helvetica, Arial, sans-serif" fontSize="20" letterSpacing="3" fill="#f4f3ea">SEPTIC &amp; CESSPOOL SERVICE</text>
  </g>
</svg>
